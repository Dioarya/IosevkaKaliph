name: Patch Fonts 2
on: workflow_dispatch

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Patch fonts
        run: |
          mkdir -p output
          docker run --rm \
            -e PN=4 \
            -v ${{ github.workspace }}/TTF:/in \
            -v ${{ github.workspace }}/output:/out \
            nerdfonts/patcher --complete --mono --progressbars
      
      - uses: actions/upload-artifact@v4
        with:
          name: patched-fonts
          path: output/
